name: Build RASCAL releases

# Ce dépôt GitHub est un miroir "instantané" du dépôt GitLab
# (gitlab.huma-num.fr/fmonna/rascal), alimenté par tools/sync-github.sh
# depuis une machine locale — les runners GitHub ne peuvent pas joindre
# gitlab.huma-num.fr. L'historique de référence reste sur GitLab.
#
# Usage : onglet Actions de GitHub -> "Run workflow" avec la version
# (ex : 1.8.9). Build les 3 OS, crée le tag vX.Y.Z et la release GitHub.
# Pour publier aussi sur GitLab : tools/gitlab-release.sh X.Y.Z

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à releaser (ex: 1.8.9)"
        required: true

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            dmg: RASCAL-macOS-arm64.dmg
          - arch: intel
            runner: macos-15-intel
            dmg: RASCAL-macOS-intel.dmg

    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: brew install libraw

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS app
        run: |
          python setup_macos.py

      - name: Create DMG
        run: |
          rm -f dist/${{ matrix.dmg }}
          hdiutil create \
            -volname "RASCAL-${{ matrix.arch }}" \
            -srcfolder dist/Rascal.app \
            -ov \
            -format UDZO \
            dist/${{ matrix.dmg }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dmg }}
          path: desktop/dist/${{ matrix.dmg }}

  windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywin32

      - name: Install WiX
        run: choco install wixtoolset -y --force

      - name: Build MSI
        run: |
          python build_windows_msi.py

      - name: Rename MSI
        shell: bash
        run: |
          mkdir -p release
          cp dist/*.msi release/RASCAL-Windows-x64.msi

      - uses: actions/upload-artifact@v4
        with:
          name: RASCAL-Windows-x64.msi
          path: desktop/release/RASCAL-Windows-x64.msi

  linux:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3 python3-pip python3-venv \
            libgl1 libglx-mesa0 libegl1 \
            libxkbcommon-x11-0 libxcb-xinerama0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libxcb-cursor0 \
            fuse libfuse2

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux AppImage
        run: |
          python3 setup_linux.py
          python3 build_linux_appimage.py

      - name: Rename AppImage
        run: |
          mkdir -p release
          cp dist/Rascal-x86_64.AppImage release/RASCAL-Linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: RASCAL-Linux-x86_64.AppImage
          path: desktop/release/RASCAL-Linux-x86_64.AppImage

  release:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Flatten release files
        run: |
          mkdir final
          find release -type f -maxdepth 3 -exec cp {} final/ \;
          ls -lh final

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: main
          name: RASCAL v${{ inputs.version }}
          files: final/*
          generate_release_notes: false
