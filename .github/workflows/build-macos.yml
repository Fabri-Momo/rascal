name: Build macOS RASCAL

on:
  workflow_dispatch:

jobs:
  build-macos-arm64:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build RASCAL
        run: |
          pyinstaller --windowed --name RASCAL Rascal.py

      - name: Create DMG
        run: |
          hdiutil create -volname RASCAL -srcfolder dist/RASCAL.app -ov -format UDZO dist/RASCAL_macos_arm64.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: RASCAL_macos_arm64
          path: dist/RASCAL_macos_arm64.dmg
